name: 回補期貨籌碼歷史（一次性）

on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始年月"
        default: "2026-07"

permissions:
  contents: write

concurrency:
  group: tw-data
  cancel-in-progress: false

jobs:
  fut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 加權指數（算價差用）
        run: python scripts/fetch_tw.py taiex ${{ github.event.inputs.start }}
      - name: 期貨籌碼與價差
        run: python scripts/fetch_fut.py ${{ github.event.inputs.start }} $(TZ=Asia/Taipei date +%Y-%m)
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fut data/tw/taiex.csv
          git diff --cached --quiet || (git commit -qm "fut backfill" && git pull --rebase -q && git push -q)
