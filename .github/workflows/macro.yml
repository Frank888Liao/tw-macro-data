name: 每日抓總經數據

on:
  schedule:
    - cron: "30 23 * * *"   # 台北 07:30（美國數據公布後）
    - cron: "30 9 * * *"    # 台北 17:30（台灣數據多在下午公布）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料
        run: python scripts/fetch_macro.py
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/macro
          git diff --cached --quiet || (git commit -m "macro $(date -u +%F)" && git pull --rebase && git push)
