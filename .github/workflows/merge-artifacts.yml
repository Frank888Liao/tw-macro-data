name: 合併回補結果（從之前的 run 取 artifact）

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "回補 run 的 ID"
        required: true
      kind:
        description: "tw 或 rev"
        default: "tw"

permissions:
  contents: write
  actions: read

concurrency:
  group: tw-data
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: bf
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 合併
        run: |
          ls bf
          if [ "${{ github.event.inputs.kind }}" = "rev" ]; then
            python scripts/fetch_extra.py merge-rev bf/*
          else
            python scripts/fetch_tw.py merge bf/*
            python scripts/fetch_tw.py taiex 2003-12
            python scripts/fetch_tw.py fill 200
          fi
      - name: 存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/tw
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -q -m "merge ${{ github.event.inputs.kind }} backfill"
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep $((i*10))
          done
          exit 1
